plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kaiserdev.watchthermometer'
    compileSdk 34

    defaultConfig {
        applicationId "com.kaiserdev.watchthermometer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Чистый Android SDK без сторонних зависимостей для максимальной скорости и легкости APK (размер ~21 КБ)
}
